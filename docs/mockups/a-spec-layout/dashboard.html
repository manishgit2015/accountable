<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable · Dashboard (mockup A)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="../assets/data.js"></script>
<script src="../assets/charts.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<script>
const wonThisMonth = REVENUE_WON[11], wonCount = DEALS_WON[11];
document.getElementById("app").innerHTML = sidebar("dashboard") + `
<main class="main">
  <div class="top">
    <div><h1>Dashboard</h1><div class="sub">Friday 20 November 2026</div></div>
    <div class="actions"><div class="search">${icon("search")}Search</div><button class="btn btn-primary">${icon("plus")}Add deal</button></div>
  </div>

  <div class="grid">
    <div class="panel kpi c3"><div class="label">Open pipeline</div><div class="big">${moneyShort(OPEN_VALUE)}</div><div class="label"><span class="num">${openDeals.length}</span> open deals</div></div>
    <div class="panel kpi c3"><div class="label">Expected revenue</div><div class="big">${moneyShort(OPEN_EXPECTED)}</div><div class="label">Value × probability of close</div></div>
    <div class="panel kpi c3"><div class="label">Won this month</div><div class="big">${moneyShort(wonThisMonth)}</div><div class="label"><span class="num">${wonCount}</span> deals · <span class="delta" style="color:var(--marigold-text)">month to date</span></div></div>
    <div class="panel kpi c3"><div class="label">Win rate, last 12 months</div><div class="big">${WIN_RATE}%</div><div class="label"><span class="num">54</span> won · <span class="num">22</span> lost</div></div>

    <div class="panel c12">
      <div class="panel-head"><h2>Open pipeline by stage</h2><span class="sub"><span class="num">${money(OPEN_VALUE)}</span> total · <span class="num">${money(OPEN_EXPECTED)}</span> expected</span></div>
      ${stackedBarHTML()}
    </div>

    <div class="panel c8">
      <div class="panel-head"><h2>Revenue won</h2><span class="sub">Last 12 months · <span class="num">${money(sum(REVENUE_WON, x => x))}</span></span></div>
      <div class="chart">${lineChart(REVENUE_WON, { w: 760, h: 470 })}</div>
    </div>
    <div class="panel c4">
      <div class="panel-head"><h2>Follow-ups</h2><span class="sub">${FOLLOW_UPS.overdue.length + FOLLOW_UPS.today.length + FOLLOW_UPS.week.length} due this week</span></div>
      ${followUpsHTML()}
    </div>

    <div class="panel c4">
      <div class="panel-head"><h2>Deals won and lost</h2><span class="sub">Last 12 months</span></div>
      <div class="legend" style="margin-bottom:8px"><span><i class="dot" style="background:var(--sea-green)"></i>Won</span><span><i class="dot" style="background:var(--sea-mist)"></i>Lost</span></div>
      <div class="chart">${groupedBars(DEALS_WON, DEALS_LOST, { w: 360, h: 330 })}</div>
    </div>
    <div class="panel c4">
      <div class="panel-head"><h2>Sales funnel</h2><span class="sub">Value reaching each stage</span></div>
      ${funnelHTML()}
    </div>
    <div class="panel c4">
      <div class="panel-head"><h2>Recent activity</h2><a class="sub" href="#">View all</a></div>
      <ul class="feed">${ACTIVITY.slice(0, 5).map(feedItem).join("")}</ul>
    </div>
  </div>
</main>`;
</script>
</body>
</html>
