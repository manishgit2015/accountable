<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable · Pipeline (mockup A)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="../assets/data.js"></script>
<script src="../assets/charts.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<script>
function card(d, extra = "") {
  const late = isLate(d);
  return `<div class="card ${extra}">
    <div class="t">${d.name}</div>
    <div class="o">${d.org}</div>
    <div class="row"><span class="num" style="font-size:14px;font-weight:600">${money(d.value)}</span><span class="num muted">${prob(d)}%</span></div>
    <div class="row" style="margin-top:8px">${late ? `<span class="badge badge-late">Late</span><span class="num late-text">${dateShort(d.close)}</span>` : `<span class="muted">${icon("calendar", "icon")}</span><span class="num muted">${dateShort(d.close)}</span>`}</div>
  </div>`;
}
function column(s) {
  const deals = byStage(s.key);
  const total = sum(deals, d => d.value), exp = sum(deals, expected);
  const closed = !OPEN.includes(s.key);
  let cards = deals.map(d => card(d)).join("");
  if (s.key === "proposal") cards = card(deals[0]) + `<div class="drop"></div>` + deals.slice(1).map(d => card(d)).join("");
  if (s.key === "negotiation") cards = deals.slice(0, 2).map(d => card(d)).join("") + card(deals[2], "lift") + card(deals[3]);
  const count = closed ? deals.length + MORE_CLOSED[s.key] : deals.length;
  return `<section class="col">
    <div class="col-head">
      <div class="name"><span class="dot" style="background:${s.color}"></span>${s.name}<span class="count">${count}</span></div>
      <div class="fig"><span>Value</span><span class="num">${money(closed ? total + (s.key === "won" ? 685000 : 318000) : total)}</span></div>
      ${closed ? `<div class="fig"><span>${s.key === "won" ? "Last 12 months" : "Last 12 months"}</span><span></span></div>` : `<div class="fig"><span>Expected</span><span class="num">${money(exp)}</span></div>`}
    </div>
    ${cards}
    ${closed ? `<div class="more">${MORE_CLOSED[s.key]} more ${s.name.toLowerCase()} deals</div>` : `<div class="add">${icon("plus")}Add deal</div>`}
  </section>`;
}
document.getElementById("app").innerHTML = sidebar("pipeline") + `
<main class="main">
  <div class="top">
    <div>
      <h1>Pipeline</h1>
      <div class="totals" style="margin-top:12px">
        <div><div class="label">Open pipeline</div><div class="big">${money(OPEN_VALUE)}</div></div>
        <div><div class="label">Expected revenue</div><div class="big">${money(OPEN_EXPECTED)}</div></div>
        <div><div class="label">Late deals</div><div class="big late-text">${openDeals.filter(isLate).length}</div></div>
      </div>
    </div>
    <div class="actions"><div class="search">${icon("search")}Search deals</div><button class="btn btn-primary">${icon("plus")}Add deal</button></div>
  </div>
  <div class="board">${STAGES.map(column).join("")}</div>
</main>`;
</script>
</body>
</html>
