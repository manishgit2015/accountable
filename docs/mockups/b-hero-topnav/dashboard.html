<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable · Dashboard (mockup B)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="../assets/data.js"></script>
<script src="../assets/charts.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const segs = OPEN.map(k => ({ s: stage(k), v: sum(byStage(k), d => d.value), e: sum(byStage(k), expected), n: byStage(k).length }));
document.getElementById("app").innerHTML = topnav("dashboard") + `
<div class="grid">
  <section class="hero">
    <div>
      <h1>Good morning</h1>
      <div class="lead">Friday 20 November 2026 · 2 follow-ups overdue, 3 deals running late</div>
      <div class="kgrid">
        <div class="k"><div class="l">Open pipeline</div><div class="v">${moneyShort(OPEN_VALUE)}</div><div class="s">${openDeals.length} open deals</div></div>
        <div class="k"><div class="l">Expected revenue</div><div class="v">${moneyShort(OPEN_EXPECTED)}</div><div class="s">Value × probability</div></div>
        <div class="k"><div class="l">Won this month</div><div class="v" style="color:var(--sea-green)">${moneyShort(REVENUE_WON[11])}</div><div class="s">${DEALS_WON[11]} deals, month to date</div></div>
        <div class="k"><div class="l">Win rate, 12 months</div><div class="v">${WIN_RATE}%</div><div class="s">54 won · 22 lost</div></div>
      </div>
    </div>
    <div>
      <div class="chart-head"><h2>Revenue won</h2><span style="font-size:12px">Last 12 months · <span class="num" style="color:#fff">${money(sum(REVENUE_WON, x => x))}</span></span></div>
      <div class="chart">${lineChart(REVENUE_WON, { w: 860, h: 270, gridColor: "#0F4C60", stroke: "#06D6A0", textColor: "#CDD8DB" })}</div>
    </div>
  </section>

  <div class="panel c5">
    <div class="panel-head"><h2>Sales funnel</h2><span class="sub">Value reaching each stage</span></div>
    ${funnelHTML()}
  </div>
  <div class="panel c4">
    <div class="panel-head"><h2>Deals won and lost</h2><div class="legend"><span><i class="dot" style="background:var(--sea-green)"></i>Won</span><span><i class="dot" style="background:var(--sea-mist)"></i>Lost</span></div></div>
    <div class="chart">${groupedBars(DEALS_WON, DEALS_LOST, { w: 400, h: 240 })}</div>
  </div>
  <div class="panel c3">
    <div class="panel-head"><h2>Open by stage</h2></div>
    <div style="position:relative;display:grid;place-items:center;margin:4px 0 12px">
      ${donut(segs.map(g => ({ v: g.v, color: g.s.color })), { size: 150, thick: 22 })}
      <div style="position:absolute;text-align:center"><div class="num" style="font-size:18px;font-weight:600">${moneyShort(OPEN_VALUE)}</div><div class="label">open</div></div>
    </div>
    ${segs.map(g => `<div style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><span class="dot" style="background:${g.s.color}"></span>${g.s.name}<span class="num" style="margin-left:auto">${moneyShort(g.v)}</span></div>`).join("")}
  </div>

  <div class="panel c6">
    <div class="panel-head"><h2>Follow-ups</h2><span class="sub">${FOLLOW_UPS.overdue.length + FOLLOW_UPS.today.length + FOLLOW_UPS.week.length} due this week</span></div>
    ${followUpsHTML()}
  </div>
  <div class="panel c6">
    <div class="panel-head"><h2>Recent activity</h2><a class="sub" href="#">View all</a></div>
    <ul class="feed">${ACTIVITY.map(feedItem).join("")}</ul>
  </div>
</div>`;
</script>
</body>
</html>
