<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable · Pipeline (mockup B)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="style.css">
<script src="../assets/data.js"></script>
<script src="../assets/charts.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function card(d) {
  const s = stage(d.stage), late = isLate(d);
  return `<div class="card">
    <div class="top"><span class="org-chip">${initials(d.org)}</span><div><div class="t">${d.name}</div><div class="o">${d.org} · ${d.contact}</div></div></div>
    <div class="row"><span class="num" style="font-size:15px;font-weight:600">${money(d.value)}</span>${late ? `<span class="badge badge-late">Late · ${dateShort(d.close).replace(" 2026", "")}</span>` : `<span class="num muted">${dateShort(d.close)}</span>`}</div>
    <div class="meter"><i style="width:${prob(d)}%;background:${s.color}"></i></div>
    <div class="row" style="margin-top:6px"><span class="muted">Probability</span><span class="num">${prob(d)}%</span></div>
  </div>`;
}
function mini(d) {
  return `<div class="mini"><div style="min-width:0"><div class="t">${d.name}</div><div class="muted" style="font-size:12px">${d.org}</div></div><div style="text-align:right"><div class="num" style="font-weight:600">${moneyShort(d.value)}</div><div class="num muted" style="font-size:11px;white-space:nowrap">${dateShort(d.close).replace(" 2026", "")}</div></div></div>`;
}
function column(s) {
  const deals = byStage(s.key), closed = !OPEN.includes(s.key);
  const total = sum(deals, d => d.value) + (s.key === "won" ? 685000 : s.key === "lost" ? 318000 : 0);
  return `<section>
    <div class="col-head"><span class="dot" style="background:${s.color}"></span><span class="name">${s.name}</span><span class="count">${closed ? deals.length + MORE_CLOSED[s.key] : deals.length}</span>
      <span class="val"><span class="num">${moneyShort(total)}</span><div class="e">${closed ? "12 months" : `<span class="num">${moneyShort(sum(deals, expected))}</span> expected`}</div></span></div>
    <div class="stack">
      ${closed ? deals.map(mini).join("") + `<div class="more">${MORE_CLOSED[s.key]} more · show all</div>` : `<div class="add">${icon("plus")}Add deal</div>` + deals.map(card).join("")}
    </div>
  </section>`;
}
document.getElementById("app").innerHTML = topnav("pipeline") + `
<div class="ph">
  <div><h1>Pipeline</h1><div class="muted" style="margin-top:4px">Drag a card to change its stage or its place in a column</div></div>
  <div style="display:flex;gap:28px;text-align:right">
    <div><div class="label">Open pipeline</div><div class="num" style="font-size:24px;font-weight:600">${money(OPEN_VALUE)}</div></div>
    <div><div class="label">Expected revenue</div><div class="num" style="font-size:24px;font-weight:600">${money(OPEN_EXPECTED)}</div></div>
  </div>
</div>
<div class="panel strip">${stackedBarHTML({ height: 12 })}</div>
<div class="board">${STAGES.map(column).join("")}</div>`;
</script>
</body>
</html>
