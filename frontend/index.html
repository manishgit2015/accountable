<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Accountable</title>
    <script>
      // Apply the saved mode before the first paint, System included, so dark mode never flashes light (R92).
      // The same rules as readChoice, modeFor and applyMode in src/lib/theme.ts: keep the two in step.
      try {
        var choice = localStorage.getItem("accountable.theme");
        var deviceDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (choice === "dark" || (choice === "system" && deviceDark)) document.documentElement.dataset.theme = "dark";
      } catch {
        // Storage blocked: light mode (R93).
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
