# Accountable on Render: one web service on the free plan (DEP-8, ADR-021, section 7.4).
# The build installs the npm and Python packages and builds the frontend; the start runs the migrations, then
# one uvicorn process serving the built page and /api on 0.0.0.0:$PORT (Render sets RENDER and PORT).
# The settings are listed without values (sync: false): they're entered in Render's dashboard, never here.
services:
  - type: web
    name: accountable
    runtime: python
    plan: free
    buildCommand: pip install uv && npm ci && uv sync --frozen && npm run build
    startCommand: uv run --no-sync --directory backend python -m app.main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ACCOUNTABLE_PUBLIC_URL
        value: https://accountable.onrender.com
      - key: TZ
        value: Singapore
